name: Rea
version: '1.0.0'
main: dev.rea.ReaPlugin
author: 'tq1r'
description: 'A fantasy bloodline SMP plugin for Paper 26.3 + Geyser. The bloodlines wake.'
commands:
  rea:
    description: Rea commands
    usage: /rea <subcommand>
  ability:
    description: Use your bloodline ability
    usage: /ability
  runes:
    description: Show your Rune balance
    usage: /runes
permissions:
  rea.use:
    description: Use Rea features
    default: true
  rea.admin:
    description: Administer Rea (run /rea start, give, reset)
    default: op
