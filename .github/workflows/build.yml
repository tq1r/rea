name: Build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: |
          set +e
          mvn -B package > build.log 2>&1
          code=$?
          tail -n 60 build.log
          if [ $code -ne 0 ]; then
            grep -E "\[ERROR\]" build.log | head -n 40 | sed 's/^/::error::/' || true
          fi
          exit $code
      - name: Post build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          log = open('build.log').read()[-50000:]
          open('payload.json', 'w').write(json.dumps({"body": "Build failed:\n```\n" + log + "\n```"}))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input payload.json
      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rea-jar
          path: target/*.jar
  release:
    needs: [build]
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build with Maven
        run: mvn -B package
      - name: Attach the jar to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Uploading target/rea-${TAG#v}.jar to release ${TAG}"
          gh release upload "$TAG" "target/rea-${TAG#v}.jar" --clobber --repo ${{ github.repository }}
