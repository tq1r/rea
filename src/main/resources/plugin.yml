name: Rea
version: '1.0.0'
main: dev.rea.ReaPlugin
api-version: '26.3'
load: POSTWORLD
author: 'tq1r'
description: 'A That Time I Got Reincarnated as a Slime plugin for Paper 26.3 + Geyser. Devour, evolve, awaken as a Demon Lord.'
website: 'https://github.com/tq1r/rea'
commands:
  rea:
    description: Rea commands
    usage: /rea <subcommand>
  ability:
    description: Open your talent menu (skills and evolution)
    usage: /ability
permissions:
  rea.use:
    description: Use Rea features
    default: true
  rea.admin:
    description: Administer Rea (/rea start, /rea admin, /rea give, /rea reset, /rea reload, /rea update)
    default: op
