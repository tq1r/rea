# Rea configuration
# A world of magicules. Edit freely — Rea will adapt.

settings:
  rune-mine-chance: 0.15
  rune-mine-min: 1
  rune-mine-max: 3
  kill-rune-chance: 0.10
  kill-rune-min: 1
  kill-rune-max: 2
  level-cap: 20
  xp-per-kill: 3
  cache-cost: 25
  cache-xp: 40
  dungeon-cooldown-minutes: 15
  cardinal-ep-bonus: 1.10
  trader-specialize-cost: 100
  # Auto-update: on boot (and every <hours> after), Rea checks GitHub Releases
  # for a newer version. If found, the new jar is staged in plugins/update/
  # and Paper swaps it in on the NEXT restart (the running jar is never
  # replaced underneath you). Set false to disable.
  auto-update: true
  auto-update-hours: 6

messages:
  welcome-no-race:
    - "&d&lWelcome to Rea&7 — your reincarnation awaits. Ask an admin to run &e/rea start&7."
  welcome:
    - "&7The magicules stir. &e/rea help &7- your path from slime to Demon Lord."
  start-broadcast:
    - "&d&lA new otherworlder descends into the Jura Sea..."
    - "&7The Federation watches. Monsters gather. &dWho will you become?"
