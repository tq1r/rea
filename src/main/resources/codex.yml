# The Codex of Rea — collectible lore.
# Right-click a Codex Page to record its entry. Pages can be copied and shared with friends.
# Edit the words freely. Rea will adapt.

codex:
  world:
    title: "The World of Rea"
    subtitle: "Codex Entry I"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "At the heart of the world burned the First Flame. It was no fire of wood or oil. It was the world's own warmth, and where it burned the seasons turned, the rivers ran sweet, and the dead rested easy."
      - "Ten bloodlines tended the Flame, each with a different gift. The elves kept its voice. The dwarves its hands. The orcs its wrath. The dragons — the dragonborn — were its first children, and the Flame loved them best."
      - "Rea was whole then. Rea was one chord. What follows in this Codex is the story of how it broke — told, as all true stories are, by people who disagree."
  sundering:
    title: "The Sundering"
    subtitle: "Codex Entry II"
    reward-runes: 20
    reward-xp: 15
    pages:
      - "The official history fits on one line: the Flame split into ten sparks, each bloodline carried one away, and the realm cracked beneath the weight of the parting. The sparks scattered across the world and became Runes."
      - "It is a tidy story. It has a cause, a moment, and no one to blame. But the old records mention eleven sparks, and only ten bloodlines ever woke. The eleventh spark was never found. It sleeps somewhere, still burning, still waiting."
      - "Keep the official story for the council fire. Keep the eleventh spark for everywhere else. A flame that splits does not split by accident. Someone wanted the bloodlines divided. Someone still does."
  bloodlines:
    title: "The Ten Bloodlines"
    subtitle: "Codex Entry III"
    reward-runes: 20
    reward-xp: 15
    pages:
      - "Each bloodline remembers the Sundering differently, and each memory is true the way a song is true: completely, and not at all. The elves say the Flame spoke. The dwarves say they built its house. The orcs say they burned with it."
      - "Trust none of them completely. Trust all of them a little. The truth is in the overlap, the way the truth of any old fire is in the ashes."
      - "What matters now is simpler: the bloodlines wake again, one wanderer at a time. Yours has chosen you. Carry it well. The Flame is watching — or whatever is left of it."
  human:
    title: "Origin of the Humans"
    subtitle: "Codex Entry IV"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's heart. When the Sundering came, we carried our spark the farthest, because someone had to, and the others were busy being right."
      - "Humans learn fast. That is our gift and our curse. We can be anything, which means we must choose, every day, what to be. The bloodline does not choose for us. That is the point."
  elf:
    title: "Origin of the Elves"
    subtitle: "Codex Entry V"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's voice. It spoke, and we listened, and we have been listening ever since. The elves do not forget. That is our gift and our curse."
      - "Long lives make long memories. We remember the world whole, and we will remember it whole again. The Flame's voice is quiet now. We are still listening."
  dwarf:
    title: "Origin of the Dwarves"
    subtitle: "Codex Entry VI"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's hands. We built its house of stone and iron, and the house is still standing. Barely. The dwarves do not stop. That is our gift and our curse."
      - "Stone remembers everything. So do we. When the world is whole again, it will be built by hands that never stopped working."
  orc:
    title: "Origin of the Orcs"
    subtitle: "Codex Entry VII"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's wrath. It burned, and we burned with it, and we would again. The orcs do not break. That is our gift and our curse."
      - "People fear the wrath. They should fear the silence more. The Flame's wrath kept the dark at bay for a thousand years. It can do it again."
  halfling:
    title: "Origin of the Halflings"
    subtitle: "Codex Entry VIII"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's luck. When the sparks were divided, the Flame chose us last. It chose right. The halflings are impossible to catch and harder to hold."
      - "Small hands, quick feet, quicker hearts. The world is big and the Flame is small, and someone has to carry it through the cracks. That someone is us."
  tiefling:
    title: "Origin of the Tieflings"
    subtitle: "Codex Entry IX"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's shadow. Every flame casts one. The tieflings are warm, wry, and fire-touched, and we are sorry about the shadow. Not really."
      - "The shadow is not the enemy. The shadow is where the Flame's light ends and the world begins. Someone has to stand there. We volunteer."
  dragonborn:
    title: "Origin of the Dragonborn"
    subtitle: "Codex Entry X"
    reward-runes: 20
    reward-xp: 15
    pages:
      - "Before bloodlines, there were dragons. The First Flame was theirs, and the dragonborn are its heirs. We carry dragonfire in our blood the way the sea carries salt."
      - "Proud, strong, draconic. The Flame loved us best, and we loved it back, and when it broke, we broke loudest. The world will hear us again."
  gnome:
    title: "Origin of the Gnomes"
    subtitle: "Codex Entry XI"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's making. We built the tools, the hinges, the clever little engines that kept the Flame fed. The Flame made us, and we made everything else."
      - "Clever, curious, bouncy. Give a gnome a broken thing and a free afternoon and the world gets fixed. The Flame's making is in good hands."
  aasimar:
    title: "Origin of the Aasimar"
    subtitle: "Codex Entry XII"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's light. We watched it burn, and we watch still. The aasimar are radiant, calm, and patient the way dawn is patient."
      - "Light does not hurry. It simply arrives, every morning, without fail. The bloodline's gift is certainty: the Flame will burn again, because we are still watching."
  goliath:
    title: "Origin of the Goliaths"
    subtitle: "Codex Entry XIII"
    reward-runes: 15
    reward-xp: 10
    pages:
      - "We were the keepers of the Flame's strength. We held it up when the world shook, and it was heavy, and it still is. The goliaths are towering, gentle, and immovable."
      - "Strength is not the same as violence. Strength is carrying the heavy thing so others do not have to. The Flame's strength is in good hands."
