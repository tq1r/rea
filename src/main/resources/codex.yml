# Rea codex entries (Tensura canon): world, reincarnation, skills, evolution.
# Each entry grants EP when first read.

entries:
  world:
    title: "The World"
    text: "A world of magicules and monsters. The strong grow; the weak are devoured."
    ep: 5
  reincarnation:
    title: "Reincarnation"
    text: "Otherworlders cross over and receive a Unique Skill born of their desires."
    ep: 10
  unique_skill:
    title: "Unique Skills"
    text: "Born of the mind and heart. Only about one in ten has any use in combat."
    ep: 10
  predator:
    title: "Predator"
    text: "The Slime's Unique Skill. Devour foes to learn their Common Skills."
    ep: 15
  gluttony:
    title: "Gluttony"
    text: "Predator, mastered and fed on the Orc Lord, evolves into Gluttony."
    ep: 15
  beelzebuth:
    title: "Beelzebuth"
    text: "Lord of Gluttony. At the Demon Lord awakening, Gluttony becomes Beelzebuth."
    ep: 20
  great_sage:
    title: "Great Sage"
    text: "A Unique Skill that speeds learning. It evolves into Raphael, Lord of Wisdom."
    ep: 15
  evolution:
    title: "Evolution"
    text: "Races evolve with EP: Goblin to Hobgoblin, Lizardman to Dragonewt, Orc to Orc Lord."
    ep: 10
  demon_lord:
    title: "Demon Lord Awakening"
    text: "At the Harvest Festival, a Unique Skill evolves into an Ultimate Skill."
    ep: 20
  slime:
    title: "Slime"
    text: "Absorption, Dissolve, Self-Regeneration. Soft, patient, unstoppable."
    ep: 10
  goblin:
    title: "Goblin"
    text: "Small, quick, everywhere. Hobgoblins serve as the vanguard of nations."
    ep: 10
  lizardman:
    title: "Lizardman"
    text: "Scale Armor. Dragonewts carry the blood of dragons."
    ep: 10
  orc:
    title: "Orc"
    text: "Strengthen. Orc Lords devour the world with Starved."
    ep: 10
  human:
    title: "Human"
    text: "Adaptable and stubborn. Heroes are born of their kind."
    ep: 10
  elf:
    title: "Elf"
    text: "Keen senses and long lives. Fairy Queens guard the forests."
    ep: 10
  dwarf:
    title: "Dwarf"
    text: "Sturdy hands and loyal hearts. Rune Lords command stone."
    ep: 10
  dire_wolf:
    title: "Dire Wolf"
    text: "Ultra Smell, Thought Communication, Coercion. Loyal to the end."
    ep: 10
  serpent:
    title: "Serpent"
    text: "Poison Breath and Heat Source Perception. Silent and deadly."
    ep: 10
  demon:
    title: "Demon"
    text: "Magic Resistance. Arch Demons and Daemon Lords rule the night."
    ep: 10
