# Rea codex entries (Tensura canon): world, reincarnation, skills, evolution.
# Each entry grants EP, XP, and runes when first read.

codex:
  world:
    title: "The World"
    subtitle: "Magicules and monsters"
    pages:
      - "A world of magicules and monsters. The strong grow; the weak are devoured."
      - "Existence Points (EP) measure a monster's worth. Ranks run from F to SSS."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 5
  reincarnation:
    title: "Reincarnation"
    subtitle: "Otherworlders cross over"
    pages:
      - "Otherworlders cross over and receive a Unique Skill born of their desires."
      - "Only about one in ten Unique Skills has any use in combat."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  unique_skill:
    title: "Unique Skills"
    subtitle: "Born of the mind and heart"
    pages:
      - "Unique Skills are the shape of their user's mind, born of strong desire."
      - "They grow as their user grows. At the summit, they evolve into Ultimate Skills."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  predator:
    title: "Predator"
    subtitle: "Rimuru's Unique Skill"
    pages:
      - "Predator is a Unique Skill, not an Ultimate. Only Rimuru and Shinsha ever held it."
      - "Slimes as a species have Intrinsic Skills: Absorb, Dissolve, Self-Regeneration."
      - "Predator devours foes and learns their Common Skills."
    reward-runes: 15
    reward-xp: 15
    reward-ep: 15
  gluttony:
    title: "Gluttony"
    subtitle: "Predator + Starved"
    pages:
      - "Predator fused with the Orc Lord's Starved becomes Gluttony."
      - "Gluttony devours everything: skills, magicules, even souls."
      - "Gluttony + Merciless becomes Beelzebuth, Lord of Gluttony."
    reward-runes: 15
    reward-xp: 15
    reward-ep: 15
  ultimate_skill:
    title: "Ultimate Skills"
    subtitle: "The Lords"
    pages:
      - "Raphael, Lord of Wisdom. Beelzebuth, Lord of Gluttony. Uriel, Lord of Vows."
      - "Veldora, Lord of Storms. Faust, Lord of Investigation. Mammon, Lord of Greed."
      - "Lucifer, Lord of Pride. Satanael, Lord of Wrath. Amaterasu, Lord of Shimmering Flame."
      - "Hastur, Lord of Starwind. Mephisto, Lord of Fantasy. Michael, Lord of Justice."
      - "Samael, Lord of Deathly Poison. Abaddon, Lord of Destruction. Belial, Lord of Underworld."
      - "Asmodeus, Lord of Lust. Sariel, Lord of Hope. Yog-Sothoth, Lord of Space-Time."
      - "Azazel, Lord of Temptation. True Hero, Lord of Heroes. Azathoth, God of the Void."
    reward-runes: 25
    reward-xp: 25
    reward-ep: 25
  beelzebuth:
    title: "Beelzebuth"
    subtitle: "Lord of Gluttony"
    pages:
      - "At the Demon Lord awakening, Gluttony becomes Beelzebuth, Lord of Gluttony."
      - "Its sub-skills: Predation, Imaginary Space, Mimicry, Corrosion, Soul Consumption."
    reward-runes: 20
    reward-xp: 20
    reward-ep: 20
  great_sage:
    title: "Great Sage"
    subtitle: "Lord of Wisdom, in waiting"
    pages:
      - "Great Sage speeds learning and analysis. It evolves into Raphael, Lord of Wisdom."
      - "Raphael's sub-skills: Thought Communication, Information Dominion, All of Creation."
    reward-runes: 15
    reward-xp: 15
    reward-ep: 15
  evolution:
    title: "Evolution"
    subtitle: "Races evolve with EP"
    pages:
      - "Goblin to Hobgoblin. Lizardman to Dragonewt. Orc to Orc Lord. Demon to Arch Demon."
      - "Evolution needs EP, level, and runes. The final form is the Demon Lord awakening."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  demon_lord:
    title: "Demon Lord Awakening"
    subtitle: "The Harvest Festival"
    pages:
      - "At the Harvest Festival, a Unique Skill evolves into an Ultimate Skill."
      - "Predator to Beelzebuth. Great Sage to Raphael. Infinity Prison to Uriel."
    reward-runes: 20
    reward-xp: 20
    reward-ep: 20
  slime:
    title: "Slime"
    subtitle: "Absorption, Dissolve, Self-Regeneration"
    pages:
      - "Soft, patient, unstoppable. The Slime's path leads to the Demon Lord."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  goblin:
    title: "Goblin"
    subtitle: "Small, quick, everywhere"
    pages:
      - "Hobgoblins serve as the vanguard of nations. Ogres walk the path of the Kijin."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  lizardman:
    title: "Lizardman"
    subtitle: "Scale Armor"
    pages:
      - "Dragonewts carry the blood of dragons. True Dragonewts are born of flame."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  orc:
    title: "Orc"
    subtitle: "Strengthen"
    pages:
      - "Orc Lords devour the world with Starved. High Orcs lead the horde."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  human:
    title: "Human"
    subtitle: "Adaptable and stubborn"
    pages:
      - "Heroes are born of their kind. Enhanced Humans walk between worlds."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  elf:
    title: "Elf"
    subtitle: "Keen senses, long lives"
    pages:
      - "Fairy Queens guard the forests. High Elves command the spirit world."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  dwarf:
    title: "Dwarf"
    subtitle: "Sturdy hands, loyal hearts"
    pages:
      - "Rune Lords command stone and steel. Master Dwarves forge the world's wonders."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  dire_wolf:
    title: "Dire Wolf"
    subtitle: "Ultra Smell, Thought Communication, Coercion"
    pages:
      - "Loyal to the end. Alpha Wolves lead the pack."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  serpent:
    title: "Serpent"
    subtitle: "Poison Breath, Heat Source Perception"
    pages:
      - "Silent and deadly. Black Serpents and Hydras rule the deep."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  demon:
    title: "Demon"
    subtitle: "Magic Resistance"
    pages:
      - "Arch Demons and Daemon Lords rule the night. Greater Demons serve the Demon Lord."
    reward-runes: 10
    reward-xp: 10
    reward-ep: 10
  true_dragons:
    title: "True Dragons"
    subtitle: "The oldest beings in existence"
    pages:
      - "True Dragons are the first of all things, born with Veldanava's creation of the world."
      - "Veldora the Storm Dragon slumbered beneath the Jura Forest for two thousand years."
      - "Invegal sleeps beneath the sea. Velda waits in her frozen palace. Luminous walks among us."
      - "Their every act is history. A single breath of theirs outlasts empires."
    reward-runes: 20
    reward-xp: 20
    reward-ep: 25
  tempest_federation:
    title: "Jura Tempest Federation"
    subtitle: "Rimuru Tempest's nation"
    pages:
      - "Founded in the Jura Forest by Rimuru Tempest, the Federation welcomes monsters and humans alike."
      - "Its citizens include goblins, lizardmen, ogres, dwarves, elves, orcs, and spirits."
      - "The Federation abolished the slave trade and freed every monster it could reach."
      - "The Harvest Festival — Rimuru's nation-changing announcement — echoes through every named soul."
    reward-runes: 20
    reward-xp: 20
    reward-ep: 25
  name_humanization:
    title: "Naming and Humanization"
    subtitle: "The power behind the Harvest Festival"
    pages:
      - "A True Demon Lord's name can change a soul: humanization awakens reason in monsters."
      - "Names also awaken dormant talents, boosting a being's EP and resistance to fate."
      - "Rimuru named hundreds in his Harvest Festival — a burden that nearly consumed him."
      - "Those who bear a name are bound to their namer's soul line."
    reward-runes: 15
    reward-xp: 15
    reward-ep: 15
  cardinal_weapons:
    title: "Cardinal Weapons"
    subtitle: "Named arms of the world's great powers"
    pages:
      - "Asura, the Heavenly Demon — one of the Seven Genesis-grade weapons forged by Veldanava. Milim's scimitar."
      - "Deva (Masayuki Rudra) and Ark (Feldway) serve the heroes of the Holy."
      - "True Gorikimaru, Flame Pillar, Night Rose, and Truth burn in the hands of legend."
      - "The Holy Sword Dragon Buster was forged by the Seven Luminaries to fell dragons."
      - "Cardinal weapons are won in the ruins — Vál Velmyra guards the rarest."
    reward-runes: 25
    reward-xp: 25
    reward-ep: 30
  dungeon:
    title: "The Dungeons"
    subtitle: "Veil-torn ruins above the world"
    pages:
      - "Dungeons are storm-torn slabs of ruined worlds, wedged into this one."
      - "Their air is thick with magicules; their treasures hum with stored power."
      - "Ogre Hunt, the Orc Lord's Fortress, and the ruins of Vál Velmyra — each deeper than the last."
      - "Cardinal weapons are buried in the deepest floors."
    reward-runes: 15
    reward-xp: 15
    reward-ep: 15
