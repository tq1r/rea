# Rea quests (Tensura canon): the path from reincarnation to Demon Lord.
# Rewards are EP.

chapters:
  chapter1:
    title: "Reincarnation"
    quests:
      - id: "first_blood"
        title: "First Blood"
        description: "Slay 5 monsters."
        type: "KILL"
        target: 5
        reward: 50
      - id: "first_ep"
        title: "Existence"
        description: "Reach 100 EP."
        type: "EP"
        target: 100
        reward: 50
      - id: "first_skill"
        title: "Skill"
        description: "Use a skill 3 times."
        type: "SKILL_USE"
        target: 3
        reward: 50
      - id: "first_evolve"
        title: "Evolution"
        description: "Evolve once."
        type: "EVOLVE"
        target: 1
        reward: 100
  chapter2:
    title: "Demon Lord"
    quests:
      - id: "hunter"
        title: "Hunter"
        description: "Slay 50 monsters."
        type: "KILL"
        target: 50
        reward: 500
      - id: "power"
        title: "Power"
        description: "Reach 2,000 EP."
        type: "EP"
        target: 2000
        reward: 500
      - id: "devourer"
        title: "Devourer"
        description: "Learn 3 Common Skills by predation."
        type: "SKILL_LEARN"
        target: 3
        reward: 500
      - id: "awakening"
        title: "Awakening"
        description: "Reach the Demon Lord form."
        type: "EVOLVE"
        target: 3
        reward: 1000
